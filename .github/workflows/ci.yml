# Ssak-Ai CI — Code Quality Pipeline
#
# Runs on every push and pull request (and nightly at midnight):
#   1. Linting (ruff check)
#   2. Formatting (ruff format)
#   3. Type checking (mypy)
#   4. Fast tests (non-slow, non-benchmark)
#   5. Package build verification (wheel/sdist)
#   6. Security scan (secrets + hardcoded credentials)
#   7. Dashboard lint & build
#   8. Coverage report + PR comment
#   9. Clean-machine reproduction (fresh export → uv sync → smoke → API E2E)
#
# Phase 1 D3: 추가된 build job, coverage PR comment, scheduled trigger, improved caching.
# Phase 1 D5: Plan/Build/Interactive 모드 검증 시나리오 포함 (test-plan-mode).

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  schedule:
    # Nightly build at 00:00 UTC — catch regressions early
    - cron: "0 0 * * *"
  workflow_call:
    # Reusable workflow for other CI pipelines (benchmark, deploy, etc.)
    # Example: jobs: { ci: { uses: ./.github/workflows/ci.yml } }

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.12"
  # Shared pip cache key — 변경 시 모든 job에서 캐시 무효화
  CACHE_VERSION: "v1"

jobs:
  lint:
    name: "Lint & Format"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # CR-11: src-layout 모듈은 editable 설치나 PYTHONPATH에 기대지 않는다.
      # uv.lock을 frozen으로 따르는 **비-editable** 환경에서만 게이트를 돌린다.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync locked environment (non-editable)
        run: uv sync --locked --no-editable --extra dev

      - name: Ruff Lint Check
        run: uv run --no-sync ruff check src/ tests/ scripts/

      - name: Ruff Format Check
        run: uv run --no-sync ruff format --check src/ tests/ scripts/

  typecheck:
    name: "Type Check"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # CR-11: src-layout 모듈은 editable 설치나 PYTHONPATH에 기대지 않는다.
      # uv.lock을 frozen으로 따르는 **비-editable** 환경에서만 게이트를 돌린다.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync locked environment (non-editable)
        run: uv sync --locked --no-editable --extra dev

      # CR-11: 도구도 잠금 환경에서 실행한다(`mypy`를 PATH에서 찾지 않는다).
      - name: Mypy Check
        run: uv run --no-sync mypy src/

      - name: BasedPyright Strict Core Gate
        run: |
          uv run --no-sync basedpyright \
            src/antigravity_k/engine/sandbox.py \
            src/antigravity_k/tools/search_benchmark.py

  mypy-gate:
    # 2026-09-06: repo-wide mypy 0 errors (pre-commit 훅, commit 1a51a5a)를
    # 로컬 커밋 밖에서도 강제한다. pre-commit mypy 훅과 **동일한 pinned argv**
    # (--ignore-missing-imports --no-strict-optional --exclude "tests/|legacy_|demo/")
    # 를 uv.lock 고정 환경에서 실행해 로컬/CI 판정이 항상 일치하게 유지한다.
    # 기존 typecheck job(mypy src/, unpinned 최신 mypy)과 별행 — 참고용 정보성 게이트.
    name: "Mypy Gate (repo-wide, pre-commit parity)"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked environment (all extras)
        run: uv sync --all-extras --frozen

      - name: Mypy (pre-commit pinned argv, repo-wide)
        run: |
          uv run --no-sync mypy --ignore-missing-imports --no-strict-optional \
            --exclude "tests/|legacy_|demo/" src/antigravity_k

  evidence-gate:
    # 여섯 층(리뷰 · 카나리아 · digest · 상태 주장 · enum identity · namespace purge · 표면)을 **한 번에**
    # 도는 단일 명령. 층마다 게이트가 있어도 그것을 도는 자리가 CI 에 없었다 — 사람이 여덟 개 명령을
    # 손으로 쳐야 했고, 그래서 어느 층이 얇은지 자동으로 막히지 않았다.
    #
    # `--tier fast` 는 커밋되지 않는 회차 산출물(`.regression-ledger/`)이 필요한 전량 회귀 원장을 돌리지
    # 않는다. 그 층은 보고서에 "이 실행이 보지 않은 층" 으로 남으며 통과로 세지 않는다(full tier 는 로컬).
    # 이 워크플로는 `paths-ignore: docs/**, **.md` 이므로 **문서만 바꾼 PR 은 여기서 돌지 않는다** —
    # 그 여집합은 `evidence.yml` 이 같은 명령으로 맡는다(둘을 합치면 모든 변경이 덮인다).
    # 실행 요약은 `$GITHUB_STEP_SUMMARY` 로 남고(빨간 실행에도), artifact 2종이 함께 올라간다.
    name: "Evidence Gate (six layers, fast)"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync locked environment (non-editable, dev extra)
        run: uv sync --locked --no-editable --extra dev

      - name: Run evidence gate
        run: |
          mkdir -p .artifacts
          uv run --no-sync python scripts/evidence_gate.py \
            --tier fast \
            --json .artifacts/evidence-gate.json \
            --summary .artifacts/evidence-gate.md

      - name: Publish summary (even when the gate fails)
        if: always()
        run: |
          if [ -f .artifacts/evidence-gate.md ]; then
            cat .artifacts/evidence-gate.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' "증거 게이트가 요약을 남기지 않았다 — 실행 자체가 죽었거나 자리표시자 오류다." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload evidence gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-gate-report
          path: |
            .artifacts/evidence-gate.json
            .artifacts/evidence-gate.md
          retention-days: 30
          if-no-files-found: warn

  test:
    name: "Tests (${{ matrix.os }}, ${{ matrix.deps }})"
    strategy:
      fail-fast: false
      matrix:
        # Run on both Linux and macOS so the Apple-Silicon / MLX code path is
        # exercised in CI (the product's primary platform).
        # deps=mlx installs mlx-lm so test_mlx_command_flags.py can verify that
        # the flags in generated training commands still exist (Phase 22).
        os: [ubuntu-latest, macos-latest]
        deps: [base, rag, mlx]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # Phase 57: 서브프로세스 기반 테스트(drift/smoke)가 pytest 인터프리터와
    # 동일한 .venv python을 쓰게 고정한다 (tests/_cli_subprocess.py 1순위).
    # uv run 안에서 uv run을 다시 띄우는 네스팅을 없애고, 드리프트 체크와
    # 스모크 테스트가 같은 인터프리터·같은 의존성 세트를 공유하게 한다.
    env:
      AGK_TEST_PYTHON: ${{ github.workspace }}/.venv/bin/python

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Dependencies
        run: |
          if [ "${{ matrix.deps }}" = "base" ]; then
            uv sync --locked --extra dev
          elif [ "${{ matrix.deps }}" = "mlx" ]; then
            uv sync --locked --extra dev --extra mlx
          else
            uv sync --locked --extra dev --extra rag
          fi

      - name: Run Tests (exclude slow/benchmark)
        run: |
          uv run --no-sync pytest tests/ \
            -v --tb=short \
            -m 'not slow and not benchmark' \
            --junit-xml=test-results.xml \
            --cov=src/antigravity_k \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Agent, Search Golden, and Citation Contract
        run: |
          uv run --no-sync pytest \
            tests/test_web_search_quality.py \
            tests/test_task_benchmark.py \
            tests/test_long_horizon_benchmark.py \
            -q --tb=short

      - name: Upload Test Results
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.deps }}
          path: test-results.xml
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Coverage Report (XML)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-${{ matrix.os }}-${{ matrix.deps }}
          path: coverage.xml
          retention-days: 30
          if-no-files-found: warn

  build:
    name: "Build Package"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # CR-11(R01): 내부 모듈(`python -m antigravity_k...`)은 프로젝트가 설치된
      # 환경에서만 돈다. 설치 없이 돌리면 새 머신에서 ModuleNotFoundError다.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync locked environment (non-editable, dev extra)
        run: uv sync --locked --no-editable --extra dev

      # CR-11(C11-05): 추적 중인 `dashboard_dist`가 낙아 있어도 그대로 포장하지 않는다.
      # 대시보드를 다시 빌드하고, 그 번들이 wheel에 들어갔는지 hash로 대조한다.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false

      - name: Set up Node.js 22.13
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: "pnpm"
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Generate release SBOMs and notices
        run: |
          uv run --no-sync python -m antigravity_k.engine.release_sbom generate \
            --project-root . \
            --release-root src/antigravity_k/release

      - name: Build wheel + sdist
        run: uv build --no-sources

      - name: Verify fresh dashboard bundle inside the wheel
        run: bash scripts/verify_dashboard_bundle.sh

      # CR-11(C11-04): 저장소 밖 신규 venv에 설치해 CLI/API/auth를 실행한다.
      - name: Verify distributions outside the repository (CLI/API/auth)
        run: bash scripts/verify_release_artifacts.sh --skip-build

      - name: Verify built distribution metadata
        run: |
          uv run --no-sync python -m antigravity_k.engine.release_metadata \
            --distribution-root dist \
            --git-ref "$GITHUB_REF"

      - name: Verify release SBOMs and notices
        run: |
          uv run --no-sync python -m antigravity_k.engine.release_sbom verify \
            --distribution-root dist \
            --release-root src/antigravity_k/release \
            --output dist/release-supply-chain.json

      - name: Record and verify Python distribution provenance
        run: |
          mkdir -p .artifacts
          uv run --no-sync python src/antigravity_k/engine/artifact_provenance.py \
            create dist --root . --output .artifacts/python-dist.json
          uv run --no-sync python src/antigravity_k/engine/artifact_provenance.py \
            verify .artifacts/python-dist.json --root .

      - name: Resolve Python provenance task
        if: ${{ vars.AGK_PROVENANCE_API_URL != '' }}
        env:
          AGK_PROVENANCE_API_URL: ${{ vars.AGK_PROVENANCE_API_URL }}
          AGK_PROVENANCE_PIN: ${{ secrets.AGK_PROVENANCE_PIN }}
          CONFIGURED_TASK_ID: ${{ vars.AGK_PROVENANCE_TASK_ID }}
        run: |
          if [ -n "$CONFIGURED_TASK_ID" ]; then
            task_id="$CONFIGURED_TASK_ID"
          else
            task_id=$(scripts/register_artifact_provenance_task.sh build "github-${{ github.run_id }}")
          fi
          echo "AGK_PROVENANCE_TASK_ID=$task_id" >> "$GITHUB_ENV"

      - name: Publish Python provenance to task event store
        if: ${{ vars.AGK_PROVENANCE_API_URL != '' }}
        env:
          AGK_PROVENANCE_API_URL: ${{ vars.AGK_PROVENANCE_API_URL }}
          AGK_PROVENANCE_PIN: ${{ secrets.AGK_PROVENANCE_PIN }}
        run: scripts/publish_artifact_provenance.sh .artifacts/python-dist.json build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/
            .artifacts/python-dist.json
            dist/release-supply-chain.json
          retention-days: 7
          if-no-files-found: warn

  dashboard:
    name: "Dashboard Lint & Build"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python for provenance gate
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install provenance verifier
        run: python -m pip install "pydantic>=2.10.0,<3.0" "typer>=0.13.0,<1.0"

      # CR-11: pnpm@11.3.0의 engines.node는 `>=22.13`이다(package.json engines와 동일).
      # Node 20을 쓰면 pnpm이 node:sqlite builtin을 찾지 못해 설치 단계가 깨진다.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false

      - name: Set up Node.js 22.13
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: "pnpm"
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Record Node/pnpm combination
        run: |
          echo "NODE: $(node --version)"
          echo "PNPM: $(pnpm --version)"

      - name: Install Dependencies (frozen)
        run: pnpm --dir dashboard install --frozen-lockfile

      - name: Lint Dashboard
        run: pnpm --dir dashboard lint

      - name: Test Dashboard
        run: pnpm --dir dashboard test

      # CR-11(C11-05): 대시보드를 다시 빌드해 vite outDir(src/antigravity_k/dashboard_dist)를
      # 갱신하고, **방금 빌드한 번들이 wheel에 그대로 들어가는지 hash로 대조**한다.
      # 추적 중인 오래된 번들이 있어도 성공처럼 포장하지 않는다.
      - name: Build Dashboard
        run: pnpm --dir dashboard build

      - name: Verify fresh dashboard bundle inside the wheel
        run: bash scripts/verify_dashboard_bundle.sh

      - name: Record and verify dashboard provenance
        run: |
          mkdir -p .artifacts
          python src/antigravity_k/engine/artifact_provenance.py \
            create src/antigravity_k/dashboard_dist --root . --output .artifacts/dashboard-dist.json
          python src/antigravity_k/engine/artifact_provenance.py \
            verify .artifacts/dashboard-dist.json --root .

      - name: Resolve dashboard provenance task
        if: ${{ vars.AGK_PROVENANCE_API_URL != '' }}
        env:
          AGK_PROVENANCE_API_URL: ${{ vars.AGK_PROVENANCE_API_URL }}
          AGK_PROVENANCE_PIN: ${{ secrets.AGK_PROVENANCE_PIN }}
          CONFIGURED_TASK_ID: ${{ vars.AGK_PROVENANCE_TASK_ID }}
        run: |
          if [ -n "$CONFIGURED_TASK_ID" ]; then
            task_id="$CONFIGURED_TASK_ID"
          else
            task_id=$(scripts/register_artifact_provenance_task.sh ui_bundle "github-${{ github.run_id }}")
          fi
          echo "AGK_PROVENANCE_TASK_ID=$task_id" >> "$GITHUB_ENV"

      - name: Publish dashboard provenance to task event store
        if: ${{ vars.AGK_PROVENANCE_API_URL != '' }}
        env:
          AGK_PROVENANCE_API_URL: ${{ vars.AGK_PROVENANCE_API_URL }}
          AGK_PROVENANCE_PIN: ${{ secrets.AGK_PROVENANCE_PIN }}
        run: scripts/publish_artifact_provenance.sh .artifacts/dashboard-dist.json ui_bundle

      - name: Upload dashboard provenance
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-provenance
          path: .artifacts/dashboard-dist.json
          retention-days: 7

  mutation-test:
    name: "Mutation Test (Stryker)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Run only on push/PR to main (not on schedule) — Stryker is resource-intensive
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false

      - name: Set up Node.js 22.13
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: "pnpm"
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Install Dependencies (frozen)
        run: pnpm --dir dashboard install --frozen-lockfile

      - name: Run Stryker Mutation Testing
        run: |
          pnpm --dir dashboard exec stryker run \
            --mutate 'src/stores/terminalStore.ts' \
            --mutate 'src/stores/outputStore.ts' \
            --mutate 'src/stores/localHistoryStore.ts' \
            --mutate 'src/stores/agentMonitorStore.ts' \
            --mutate 'src/plugin/pluginRegistry.ts'
        env:
          # Headless mode — no TTY interaction needed
          CI: true

      - name: Upload Stryker Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-report
          path: dashboard/reports/
          retention-days: 30
          if-no-files-found: ignore

  security-scan:
    name: "Security Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── 1. Secret scanning (gitleaks) ──────────────────────────
      - name: Secret Scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: true

      # ── 2. Python dependency audit ─────────────────────────────────
      # CR-11(R02): 감사는 **제품이 실제 출하하는 의존성**(base + Dockerfile extras)을
      # 대상으로 한다. 설치 안 된 환경을 훑는 `pip-audit --strict`는 "프로젝트 전체 감사"가
      # 아니다. 입력 기록과 취약점/인프라 오류 구분은 감사 스크립트가 담당한다.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Dependency Audit (base + shipped extras)
        env:
          AGK_AUDIT_RECORD: .artifacts/python-audit-inputs.json
        run: |
          mkdir -p .artifacts
          bash scripts/audit_python_dependencies.sh

      - name: Upload audit inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-audit-inputs
          path: .artifacts/python-audit-inputs.json
          retention-days: 30
          if-no-files-found: warn

      # ── 3. SAST (bandit) ───────────────────────────────────────
      - name: Sync locked environment (non-editable, dev extra)
        run: uv sync --locked --no-editable --extra dev

      - name: SAST Scan (bandit)
        run: |
          # Scan src/ for common security issues; fail on MEDIUM+ severity.
          uv run --no-sync bandit -r src/antigravity_k -ll -ii -ii \
            -x src/antigravity_k/engine/secret_scanner.py \
            -f sarif -o bandit-results.sarif || true
          # Re-run to get a pass/fail exit code for the gate (level MEDIUM+).
          uv run --no-sync bandit -r src/antigravity_k -ll \
            -x src/antigravity_k/engine/secret_scanner.py

      - name: Upload Bandit SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-results
          path: bandit-results.sarif

      # ── 4. Internal secret scanner (legacy, kept for coverage) ─
      # CR-11(C11-01): non-editable 잠금 설치를 쓴다 — `sys.path.insert('src')`로
      # 우연히 import되던 경로를 없앤다.
      - name: Secret Scan (internal scanner)
        run: |
          uv run --no-sync python -c "
          from antigravity_k.engine.secret_scanner import scan_for_secrets, is_sensitive_file
          import os

          issues = []
          for root, dirs, files in os.walk('.'):
              if any(s in root for s in ['.git', '__pycache__', 'node_modules', '.venv', 'dist', 'build', '.antigravity']):
                  continue
              for fname in files:
                  if fname.startswith('.'):
                      continue
                  if is_sensitive_file(fname):
                      continue
                  fpath = os.path.join(root, fname)
                  try:
                      with open(fpath, 'r', encoding='utf-8', errors='ignore') as fh:
                          content = fh.read()
                      matches = scan_for_secrets(content)
                      if matches:
                          issues.append(f'  {fpath}: {[m.pattern for m in matches]}')
                  except Exception:
                      pass

          if issues:
              print('Potential secrets detected:')
              for i in issues:
                  print(i)
              print(f'\nTotal: {len(issues)} file(s) with potential secrets')
              sys.exit(1)
          else:
              print('No secrets detected in scanned files.')
          "

  e2e-test:
    name: "E2E Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Run only on push/PR to main (not on schedule) — requires backend server
    if: github.event_name != 'schedule'
    env:
      AGK_BACKEND_URL: http://127.0.0.1:8000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # CR-11(C11-01): src-layout 모듈은 editable 설치나 PYTHONPATH=src에 기대지 않는다.
      # 잠금파일을 frozen으로 따르는 **비-editable** 환경에서만 E2E를 돌린다.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync locked environment (non-editable, dev extra)
        run: uv sync --locked --no-editable --extra dev

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false

      - name: Set up Node.js 22.13
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: "pnpm"
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Install Dashboard Dependencies (frozen)
        run: pnpm --dir dashboard install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm --dir dashboard exec playwright install chromium

      - name: Build Dashboard (static)
        run: pnpm --dir dashboard build

      - name: Verify fresh dashboard bundle inside the wheel
        run: bash scripts/verify_dashboard_bundle.sh --skip-build

      - name: Start Backend Server
        run: |
          E2E_STATE="$(mktemp -d)"
          printf '%s' "e2e-secret-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" > "$E2E_STATE/token_secret"
          AGK_SEC_TOKEN_SECRET_FILE="$E2E_STATE/token_secret" \
          AGK_SEC_PIN_HASH_FILE="$E2E_STATE/auth_hash" \
          .venv/bin/python -m uvicorn antigravity_k.api.server:app \
            --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"
          echo "SERVER_PID=$SERVER_PID" >> "$GITHUB_ENV"
          # Wait for server to be ready
          for i in $(seq 1 10); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/health 2>/dev/null)
            if [ "$status" = "200" ]; then
              echo "Backend server ready (HTTP $status)"
              break
            fi
            echo "Waiting for backend... attempt $i"
            sleep 2
          done

      - name: Run Python E2E Smoke Tests
        run: |
          set -o pipefail
          uv run --no-sync python -m pytest tests/test_e2e_smoke.py -v --tb=short 2>&1 | tee e2e-smoke-results.txt

      - name: Run Accessibility E2E Tests (Playwright)
        env:
          PLAYWRIGHT_OUTPUT_DIR: a11y-test-results
        run: |
          set -o pipefail
          pnpm --dir dashboard exec playwright test \
            e2e/tests/accessibility.spec.ts \
            --project=chromium --reporter=list 2>&1 | tee e2e-a11y-results.txt

      - name: Run Full Playwright E2E Suite
        # Full suite is a hard gate. Shell pipelines must preserve Playwright's nonzero exit.
        run: |
          set -o pipefail
          pnpm --dir dashboard exec playwright test --project=chromium --reporter=list 2>&1 | tee e2e-full-results.txt
        env:
          PLAYWRIGHT_OUTPUT_DIR: test-results-full

      - name: Upload E2E Smoke Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-results
          path: e2e-smoke-results.txt
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Accessibility E2E Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-a11y-results
          path: e2e-a11y-results.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Accessibility E2E Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-a11y-artifacts
          path: dashboard/a11y-test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Full E2E Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: dashboard/e2e-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Full E2E Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-full-artifacts
          path: dashboard/test-results-full/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop Backend Server
        if: always()
        run: |
          pkill -f "uvicorn antigravity_k.api.server:app" || true

  dependency-sbom:
    name: "SBOM Generation"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # CR-11(R01): 설치 없이 내부 모듈을 돌리지 않는다.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync locked environment (non-editable, dev extra)
        run: uv sync --locked --no-editable --extra dev

      - name: Generate release SBOMs and notices
        run: |
          uv run --no-sync python -m antigravity_k.engine.release_sbom generate \
            --project-root . \
            --release-root src/antigravity_k/release

      - name: Build SBOM distribution
        run: uv build --no-sources

      - name: Verify release SBOM distribution
        run: |
          uv run --no-sync python -m antigravity_k.engine.release_sbom verify \
            --distribution-root dist \
            --release-root src/antigravity_k/release \
            --output release-supply-chain.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: |
            src/antigravity_k/release/python.cdx.json
            src/antigravity_k/release/dashboard.cdx.json
            release-supply-chain.json
          retention-days: 90
          if-no-files-found: error

  clean-machine:
    name: "Clean-machine reproduction (${{ matrix.os }})"
    # "내 머신에서는 되는데" 차단: HEAD를 임시 디렉터리에 새로 익스포트한 뒤
    # 로컬 .venv/캐시 오염 없이 uv sync(잠금파일 강제) → CLI/API E2E smoke →
    # wheel 빌드 → 신규 venv pip install → 아티팩트 검증까지 수행.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git archive HEAD용 히스토리 보장

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify clean-machine reproduction (uv sync → smoke → wheel → pip install)
        run: bash scripts/verify_clean_machine.sh

  coverage-report:
    name: "Coverage Report"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test]
    if: github.event_name == 'pull_request' && !cancelled()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Coverage XML
        uses: actions/download-artifact@v4
        with:
          name: coverage-xml-ubuntu-latest-rag
          path: ./
          run-id: ${{ github.event.workflow_run.id || github.run_id }}

      - name: Generate Coverage Summary
        id: coverage-summary
        run: |
          if [ ! -f coverage.xml ]; then
            echo "No coverage.xml found — skipping"
            echo "has-report=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Extract coverage percentage from Cobertura XML
          COVER_PCT=$(python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          line_rate = float(root.attrib.get('line-rate', 0))
          print(f'{line_rate * 100:.1f}')
          ")

          echo "coverage-pct=$COVER_PCT" >> "$GITHUB_OUTPUT"
          echo "has-report=true" >> "$GITHUB_OUTPUT"
          echo "Coverage: $COVER_PCT%"

          # Generate markdown summary
          cat > coverage-summary.md << EOF
          ## 📊 Coverage Report

          **Total coverage:** ${COVER_PCT}%

          | Metric | Value |
          |:---|---:|
          | Line Coverage | ${COVER_PCT}% |
          | Threshold | 동적 측정 |

          > Current coverage as of 2026-07 is 57%. Run `pytest --cov=src/antigravity_k` locally to check current status.

          > See [coverage_html](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/coverage/) for full report.
          EOF

          echo "Summary generated"

      - name: Upload Coverage Summary
        if: steps.coverage-summary.outputs.has-report == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage-summary.md
          retention-days: 7
          if-no-files-found: warn

      - name: Post PR Comment
        if: steps.coverage-summary.outputs.has-report == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'coverage-summary.md';

            if (!fs.existsSync(reportPath)) {
              console.log('No coverage summary found — skipping PR comment');
              return;
            }

            const body = fs.readFileSync(reportPath, 'utf-8');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.body && c.body.includes('Coverage Report')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              console.log('Updated existing coverage comment');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              console.log('Created new coverage comment');
            }
