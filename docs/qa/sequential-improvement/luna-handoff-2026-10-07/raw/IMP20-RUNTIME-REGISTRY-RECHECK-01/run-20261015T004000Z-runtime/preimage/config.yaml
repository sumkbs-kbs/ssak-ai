model:
  main_model: qwen3.8
  code_model: qwen3.8
  embedding_model: mlx-community/bge-m3-4bit
  vision_model: qwen3.8
  api_engine: ollama
  max_tokens: 8192
  temperature: 0.7
  top_p: 0.9
  # 복잡도 게이트 thinking: is_complex_task 통과 태스크에만 qwen3 추론(think)을
  # 켠다. 2026-09-01 실측(scripts/measure_thinking_ab.py, 검증 가능한 8문제,
  # qwen3.8:27b): OFF 5/8 → ON 8/8 정답, 지연 3.32x — 정확도 2배급 향상.
  # 단순 대화(simple_chat)는 이 게이트를 통과하지 않아 속도 유지.
  complex_task_thinking: true
models:
  reasoning:
  - name: qwen3.8
    repo: qwen3.8:latest
    role: reasoning
    parameter_count_b: 27.0
    estimated_memory_gb: 18.0
    context_length: 262144
    description: Qwen3.8 27B (Ollama / Local, 고성능 단일 메인 모델)
